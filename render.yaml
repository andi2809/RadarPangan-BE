# Blueprint Render untuk RadarPangan-Server (free tier).
# Cara pakai: Render Dashboard -> New -> Blueprint -> pilih repo RadarPangan-Server.
services:
  - type: web
    name: radar-pangan-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: APP_ENV
        value: production
      - key: RADAR_API_KEY
        sync: false
